<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViaCEP Webservice</title>
    <script>
      function limpa_formulario_cep() {
        document.getElementById("rua").value = "";

        document.getElementById("bairro").value = "";

        document.getElementById("cidade").value = "";

        document.getElementById("uf").value = "";

        document.getElementById("ibge").value = "";
      }

      function meu_callback(conteudo) {
        if (!("erro" in conteudo)) {
          document.getElementById("rua").value = conteudo.logradouro;

          document.getElementById("bairro").value = conteudo.bairro;

          document.getElementById("cidade").value = conteudo.localidade;

          document.getElementById("uf").value = conteudo.uf;

          document.getElementById("ibge").value = conteudo.ibge;
        } else {
          limpa_formulario_cep();

          alert("CEP não encontrado.");
        }
      }

      function pesquisacep(valor) {
        var cep = valor.replace(/\D/g, "");

        if (cep != "") {
          var validacep = /[0-9]{8}$/;

          if (validacep.test(cep)) {
            document.getElementById("rua").value = "...";

            document.getElementById("bairro").value = "...";

            document.getElementById("cidade").value = "...";

            document.getElementById("uf").value = "...";

            document.getElementById("ibge").value = "...";

            var script = document.createElement("script");

            script.src =
              "https://viacep.com.br/ws/" + cep + "json/?callback=meu_callback";

            document.body.appendChild(script);
          } else {
            limpa_formulario_cep();

            alert("Formato de CEP inválido");
          }
        } else {
          limpa_formulario_cep();
        }
      }
    </script>
  </head>
  <body>
    <form method="get" action=".">
      <label>
        Cep:

        <input
          type="text"
          name="cep"
          id="cep"
          value=""
          size="10"
          maxlength="9"
          onblur="pesquisacep(this.value)"
        />

      
      </label>

      <br />

      <label>
        Rua:

        <input type="text" name="rua" id="rua" size="60" />
      </label>

      <br />

      <label>
        Bairro:

        <input type="text" name="bairro" id="bairro" size="40" />
      </label>

      <br />

      <label>
        Cidade:

        <input type="text" name="cidade" id="cidade" size="40" />
      </label>

      <br />

      <label>
        Estado:

        <input type="text" name="uf" id="uf" size="2" />
      </label>

      <label>
        IBGE:

        <input type="text" name="ibge" id="ibge" size="8" />
      </label>

      <br />
    </form>
  </body>
</html>
